# Cargo configuration for wasm32-wasip1 cross-compilation.

[target.wasm32-wasip1]
linker = "/opt/wasi-sdk/bin/clang"
rustflags = [
    # malloc/free are exported so a host runtime can allocate guest linear
    # memory and pass string arguments (input/output/bundle paths) to the
    # parameterized tectonic_compile entry point.
    "-C", "link-args=-Wl,--export=tectonic_compile -Wl,--export=tectonic_compile_defaults -Wl,--export=tectonic_generate_format -Wl,--export=tectonic_abi_version -Wl,--export=malloc -Wl,--export=free -lc++ -lc++abi -lwasi-emulated-mman -lwasi-emulated-signal",
]
